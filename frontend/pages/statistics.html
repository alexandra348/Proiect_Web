<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics</title>

    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/statistics.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link rel="stylesheet" href="/assets/css/buttons.css">
    <link rel="stylesheet" href="/assets/css/cards.css">
    <link rel="stylesheet" href="/assets/css/categories.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>

<body style="visibility:hidden;">

<div class="main-layout">

<div id="sidebar"></div>

<div class="content">

<h1>Statistics</h1>
<p>Overview of drinks, categories, providers and user preferences</p>

<div id="statistics-container" class="stats-cards">

    <div class="card">
        <h3>🥤Top Drinks</h3>
        <p id="top-drinks-count">0</p>
    </div>

    <div class="card">
        <h3>☕Top Category</h3>
        <p id="top-category">-</p>
    </div>

    <div class="card">
        <h3>🏪Top Provider</h3>
        <p id="top-provider">-</p>
    </div>

</div>

<section class="stats-section">
    <h2>Top Categories</h2>
    <div id="categories-chart" class="chart-box"></div>

    <div class="export-actions">
    <button class="btn btn-primary export-csv-btn" data-section="top_categories">
        Export CSV
    </button>

    <button class="btn btn-primary export-svg-btn" data-section="top_categories">
        Export SVG
    </button>
</div>
</section>


<section class="stats-section">
    <h2>Top Providers</h2>
    <div id="providers-chart" class="chart-box"></div>

    <div class="export-actions">
        <button class="btn btn-primary export-csv-btn" data-section="top_providers">
            Export CSV
        </button>

        <button class="btn btn-primary export-svg-btn" data-section="top_providers">
            Export SVG
        </button>
    </div>
</section>

<section class="stats-section">
    <h2>Top Restrictions</h2>
    <div id="restrictions-chart" class="chart-box"></div>

    <div class="export-actions">
        <button class="btn btn-primary export-csv-btn" data-section="top_restrictions">
            Export CSV
        </button>

        <button class="btn btn-primary export-svg-btn" data-section="top_restrictions">
            Export SVG
        </button>
    </div>
</section>

<section>
    <h2>Top Drinks</h2>
    <table class="stats-table">
        <thead>
            <tr>
                <th>Drink</th>
                <th>Popularity</th>
            </tr>
        </thead>
        <tbody id="top-drinks-table"></tbody>
    </table>

    <div class="export-actions">
      <button class="btn btn-primary export-csv-btn" data-section="top_drinks">
        Export CSV
      </button>

      <button id="rss-btn" class="btn btn-primary">
        Export RSS
       </button>
    </div>

</section>

<section>
    <h2>Top Ingredients</h2>
    <table class="stats-table">
        <thead>
            <tr>
                <th>Ingredient</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="top-ingredients-table"></tbody>
    </table>

      <div class="export-actions">
    <button class="btn btn-primary export-csv-btn" data-section="top_ingredients">
        Export CSV
    </button>
    </div>
</section>

<section>
    <h2>Avoided Ingredients</h2>
    <table class="stats-table">
        <thead>
            <tr>
                <th>Ingredient</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="avoided-ingredients-table"></tbody>
    </table>

     <div class="export-actions">
    <button class="btn btn-primary export-csv-btn" data-section="avoided_ingredients">
        Export CSV
    </button>
    </div>
</section>

<div id="footer"></div>

</div>
</div>

<script type="module" src="../assets/js/route-guard.js"></script>
<script type="module" src="../assets/js/app.js"></script>
<script type="module" src="../assets/js/statistics.js"></script>

</body>
</html>
