<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link rel="stylesheet" href="/assets/css/buttons.css">
    <link rel="stylesheet" href="/assets/css/cards.css">
    <link rel="stylesheet" href="/assets/css/categories.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>

<body style="visibility:hidden;">

<div class="main-layout">

<div id="sidebar"></div>

<div class="content">

<h1>Dashboard</h1>

<div id="admin-dashboard">

    <div class="dashboard-tabs">

        <button class="tab-btn active" data-tab="users">
            Users
        </button>

        <button class="tab-btn" data-tab="providers">
            Providers
        </button>

        <button class="tab-btn" data-tab="drinks">
            Drinks
        </button>

        <button class="tab-btn" data-tab="categories">
            Categories
        </button>

        <button class="tab-btn" data-tab="ingredients">
            Ingredients
        </button>

    </div>

    <div id="admin-content"></div>
    <div id="category-modal" class="modal hidden">

        <div class="modal-content">

            <button
                id="close-category-modal"
                class="modal-close">
                ✕
            </button>

            <h2 id="category-modal-title">
                Add Category
            </h2>

            <form id="category-form">

                <input
                    id="category-name"
                    placeholder="Category name"
                    required>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save
                </button>

            </form>

        </div>

    </div>

    <div id="user-modal" class="modal hidden">

        <div class="modal-content">

            <button
                id="close-user-modal"
                class="modal-close">
                ✕
            </button>

            <h2 id="user-modal-title">
                Add User
            </h2>

            <form id="user-form">

                <input
                    id="user-name"
                    placeholder="Name"
                    required>

                <input
                    id="user-email"
                    type="email"
                    placeholder="Email"
                    required>

                <input
                    id="user-password"
                    type="password"
                    placeholder="Password">

                <select id="user-role">

                    <option value="user">
                        user
                    </option>

                    <option value="admin">
                        admin
                    </option>

                </select>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save
                </button>

            </form>

        </div>

    </div>

    <div id="provider-modal" class="modal hidden">

        <div class="modal-content">

            <button
                id="close-provider-modal"
                class="modal-close">

                ✕

            </button>

            <h2 id="provider-modal-title">
                Add Provider
            </h2>

            <form id="provider-form">

                <input
                    id="provider-name"
                    placeholder="Name"
                    required>

                <input
                    id="provider-email"
                    type="email"
                    placeholder="Email"
                    required>

                <input
                    id="provider-password"
                    type="password"
                    placeholder="Password">

                <input
                    id="provider-address"
                    placeholder="Address">

                <input
                    id="provider-city"
                    placeholder="City">

                <input
                    id="provider-type"
                    placeholder="Type">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Save

                </button>

            </form>

        </div>

    </div>

</div>

<div id="footer"></div>

</div>
</div>

<script type="module" src="../assets/js/route-guard.js"></script>
<script type="module" src="../assets/js/admin_dashboard.js"></script>


</body>
</html>
