<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link rel="stylesheet" href="/assets/css/buttons.css">
    <link rel="stylesheet" href="/assets/css/cards.css">
    <link rel="stylesheet" href="/assets/css/categories.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>

<body style="visibility:hidden;">

<div class="main-layout">

<div id="sidebar"></div>

<div class="content">

<h1>Dashboard</h1>

<div class="stats-grid">

    <div class="stat-card">
        <h3>Wishlist</h3>
        <p id="wishlist-count">0</p>
    </div>

    <div class="stat-card">
        <h3>Tried Drinks</h3>
        <p id="tried-count">0</p>
    </div>

    <div class="stat-card">
        <h3>Categories</h3>
        <p id="categories-count">0</p>
    </div>

    <div class="stat-card">
        <h3>Providers</h3>
        <p id="providers-count">0</p>
    </div>

</div>

<div class="dashboard-sections">

    <div class="dashboard-section">

    <h2>Wishlist</h2>

    <div id="wishlist"></div>

    </div>

    <div class="dashboard-section">

    <h2>Tried Drinks</h2>

    <div class="drinks-table">
        <div id="tried-drinks"></div>
    </div>

    </div>

    <div class="card">
        <h2>Favorite Categories</h2>
        <div id="favorite-categories"></div>
    </div>

    <div class="card">
        <h2>Favorite Ingredients</h2>
        <div id="favorite-ingredients"></div>
    </div>

    <div class="card">
        <h2>Avoided Ingredients</h2>
        <div id="avoided-ingredients"></div>
    </div>

    <div class="card">
        <h2>Restrictions</h2>
        <div id="restrictions"></div>
    </div>

    <div class="card">
        <h2>Favorite Providers</h2>
        <div id="favorite-providers"></div>
    </div>

</div>


<div id="footer"></div>

</div>
</div>

<script type="module" src="../assets/js/route-guard.js"></script>
<script type="module" src="../assets/js/dashboard.js"></script>


</body>
</html>
