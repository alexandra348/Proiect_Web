<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Soft Drinks</title>

<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/assets/css/dashboard.css">
<link rel="stylesheet" href="/assets/css/buttons.css">
<link rel="stylesheet" href="/assets/css/cards.css">
<link rel="stylesheet" href="/assets/css/categories.css">
<link rel="stylesheet" href="/assets/css/forms.css">
<link rel="stylesheet" href="/assets/css/navbar.css">
<link rel="stylesheet" href="/assets/css/responsive.css">

</head>

<body>

<div class="main-layout">

<div id="sidebar"></div>

<div class="content">


<section>

<h1>
Discover Drinks
</h1>

<p>
Browse and manage products
</p>

<div class="filters">

    <button id="btn-categories" class="tab-btn">
        Categories
    </button>

    <button id="btn-providers" class="tab-btn">
        Providers
    </button>

</div>

</section>

<br>

<div id="drinks-container" ></div>

<template id="drink-card-template">
    <div class="drink-card">

        <img class="drink-image">
        <h3 class="drink-name"></h3>
        <p class="drink-price"></p>
        <p class="drink-category"></p>
        <p class="drink-provider"></p>
        <div class="drink-actions">
            <button class="wishlist-btn">
                ♡
            </button>

            <button class="tried-btn">
                ✓
            </button>
        </div>
    </div>
</template>

<div id="tried-modal" class="modal hidden">

    <div class="modal-content">

        <button
            id="close-modal"
            class="modal-close">
            ✕
        </button>

        <h2>Rate this drink</h2>

        <form id="tried-form">

            <label>Rating *</label>

            <select id="drink-rating" required>
                <option value="">Select rating</option>
                <option value="1">1 ⭐</option>
                <option value="2">2 ⭐</option>
                <option value="3">3 ⭐</option>
                <option value="4">4 ⭐</option>
                <option value="5">5 ⭐</option>
            </select>

            <label>Comment</label>

            <textarea
                id="drink-comment"
                rows="4">
            </textarea>

            <button
                type="submit"
                class="btn btn-primary">
                Save
            </button>

        </form>

    </div>

</div>

<div id="footer"></div>

</div>

</div>

<script type="module" src="../assets/js/app.js"></script>

</body>
</html>
