services:
  nginx:
    image: nginx:latest
    ports:
      - "8085:80"
    volumes:
      - ../:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - swagger-ui

  php:
    build: ./php
    volumes:
      - ../:/var/www
    env_file:
      - ../.env
    depends_on:
      - postgres

  swagger-ui:
    image: swaggerapi/swagger-ui
    volumes:
      - ./openapi.json:/openapi.json
    environment:
      SWAGGER_JSON: /openapi.json

  postgres:
    image: postgres:15
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: softdrinks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sergiu
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql