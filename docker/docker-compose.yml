

services:
  nginx:
    image: nginx:latest
    ports:
      - "8081:81"
    volumes:
      - ../:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./php
    volumes:
      - ../:/var/www
    env_file:
      - ../.env
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: softdrinks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sergiu
    ports:
      - "5432:5432"
    volumes:
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql