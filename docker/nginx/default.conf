server {
    listen 81;
    server_name localhost;

    
    root /var/www/frontend/pages;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    
    location /api {
        rewrite ^/api/?(.*)$ /index.php?$1 last;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    }
}